services:
  qdrant-router:
    image: haproxy:3.2-alpine
    container_name: qdrant-router_${ENV}
    restart: always
    depends_on:
      qdrant-0:
        condition: service_healthy
      qdrant-1:
        condition: service_healthy
      qdrant-2:
        condition: service_healthy
    ports:
      - 6339:6333
    configs:
      - source: haproxy_config
        target: /usr/local/etc/haproxy/haproxy.cfg
    networks:
      - backend

  qdrant-0:
    image: qdrant/qdrant:v1.16.2
    container_name: qdrant-0_${ENV}
    restart: always
    command: ["./entrypoint.sh", "--uri", "http://qdrant-0:6335"]
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant-0_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant-1:
    image: qdrant/qdrant:v1.16.2
    container_name: qdrant-1_${ENV}
    restart: always
    command:
      - ./entrypoint.sh
      - --bootstrap
      - http://qdrant-0:6335
      - --uri
      - http://qdrant-1:6335
    depends_on:
      qdrant-0:
        condition: service_healthy
    ports:
      - 6335:6333
      - 6336:6334
    expose:
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant-1_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant-2:
    image: qdrant/qdrant:v1.16.2
    container_name: qdrant-2_${ENV}
    restart: always
    command:
      - ./entrypoint.sh
      - --bootstrap
      - http://qdrant-0:6335
      - --uri
      - http://qdrant-2:6335
    depends_on:
      qdrant-0:
        condition: service_healthy
    ports:
      - 6337:6333
      - 6338:6334
    expose:
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant-2_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant-0_data:
    external: true
    name: ${SLUG}_qdrant-0_data_${ENV}
  qdrant-1_data:
    external: true
    name: ${SLUG}_qdrant-1_data_${ENV}
  qdrant-2_data:
    external: true
    name: ${SLUG}_qdrant-2_data_${ENV}

networks:
  backend:
    external: true
    name: ${SLUG}_${ENV}

configs:
  qdrant_config:
    content: |
      log_level: INFO
      cluster:
        enabled: true
        p2p:
          port: 6335
  haproxy_config:
    content: |
      global
        maxconn 4096

      defaults
        mode http
        timeout connect 5s
        timeout client 30s
        timeout server 30s

      frontend qdrant
        bind *:6333
        default_backend qdrant_nodes

      backend qdrant_nodes
        option httpchk GET /healthz
        server qdrant-0 qdrant-0:6333 check
        server qdrant-1 qdrant-1:6333 check
        server qdrant-2 qdrant-2:6333 check
